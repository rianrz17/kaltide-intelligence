services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kaltide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaltide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaltide}
      POSTGRES_DB: ${POSTGRES_DB:-kaltide}
    ports:
      - "5432:5432"
    volumes:
      - kaltide_db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  backend:
    build:
      context: ./backend
    container_name: kaltide-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: kaltide-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  kaltide_db_data:
